# The meter sits between the agent and the model API. It declares its own network, so it is not behind Harbor's
# egress sidecar: it is the one service with a way out. The agent (main) is behind the sidecar, whose agent-phase
# allowlist is the host "meter" only (task.toml).
services:
  main:
    depends_on:
      meter:
        condition: service_healthy
  meter:
    build:
      context: ./meter
    environment:
      METER_BUDGET: "{{token_budget}}"
    networks:
      - default
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_meter/status', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
