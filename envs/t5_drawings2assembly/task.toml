# t5_drawings2assembly -- a full set of part drawings + the assembly drawing -> 3-D
# assembly (both shape and placement are tested)
[task]
id = "t5_drawings2assembly"
kind = "assembly"
submission = "cadquery_program"
inputs = ["drawing.png", "drawing_tile_*.png", "bom.json", "part_drawings/*.png", "step_files/*.step"]
given = "purchased_parts_step"

# STALE (superseded by the [tools] note below: nothing is injected any more, and
# purchased parts are handed over as step_files/):
# Shop drawings never include drawings for purchased parts (pneumatic cylinders, linear
# bearings, washers); the designation is the complete specification. In a purely 2-D task
# there is no way to build them, so a library was supplied to look them up by designation
# -- only T5 needed it.

[tools]
# The reference renderer is NOT injected. bench_views.py is the module that
# produced the prompt images (same cameras, same pinned PARALLEL_SCALE), so
# supplying it made the model's render pixel-comparable to the target for free
# and turned much of the task into optimising against the function that
# generated the answer. Upstream measurement: 72% of programs compute a metric
# and 57% write a sweep loop against it.
#
# Task-design rule: do not supply what can be derived; do supply what cannot
# exist. A projection is derivable -- cadquery and vtk are both in the
# container -- so recovering the camera is part of the task.
renderer = "none"
# Nothing is injected. The standard-parts library this once named is not
# shipped and not read: the current T5 hands purchased parts over as
# step_files/ instead of making the model search a 269-part catalogue
# (see envs/common/sandbox.py).
inject = []

[verify]
entry = "envs.verifiers.assembly:score"
# The input is purely 2-D, so the orientation cannot be derived from the drawings.
orientation = "free"
# Headline metric (docs/METRICS.md): part_x_asm_v1 = avg_part x asm_v1, in [0, 1].
#   avg_part  part_v1 per reference instance: the submitted child against the
#             reference instance (gt/parts/<id>.step placed by gt/instances.json
#             for a part modelled from its drawing, the supplied STEP for a
#             purchased part), both in the frame asm_v1 aligned the submission
#             to; mean per part type, then over types
#   asm_v1    per-part-type leave-one-type-out IoU gain, normalised by (1 - baseline)
# The orientation is free, so the per-instance comparison searches the 24
# proper rotations about the reference instance's centre and applies the one
# iou24 finds to all three terms (pose_mode iou24_aligned, as T1).
metric = "part_x_asm_v1"
pose_mode = "iou24_aligned"
# Which part types avg_part averages over (docs/METRICS.md, "The T5 scope rule").
# T5 supplies most of its part types as step_files/ -- case1 hands over 16 of 21
# and keeps 5 as part_drawings/ -- and avg_part is a mean over TYPES, so under
# "all" a submission that merely re-exports the supplied STEPs collects 16 free
# 1.0s and avg_part >= 16/21 = 0.76 before it models anything. The part half of
# the score has to measure the parts the model actually had to build, so the
# mean runs over the `source = "drawing"` rows of input/bom.json only. Every
# other type is still scored and reported per instance (a client needs to see
# that the supplied parts were handled correctly), just not averaged in.
# T2 and T4 keep "all": every part is supplied there, so there is nothing else
# to average.
avg_part_types = "modelled"
oracle = "data/t5_drawings2assembly/_oracle"

[data]
# ⚠️ **The source corpus must be written down in the task declaration; it must never be
# inferred from a directory name or a runtime argument.**
# The T3/T4 families come from the open corpus `benchcad-2`; the held-out set comes from
# `the heldout corpus` and is **a different set of families**.
# Family names overlap between the two (one part family has a copy in each corpus), so
# the case name alone cannot tell them apart -- and once a held-out case is mixed into a
# batch of results, the held-out set is contaminated, irreversibly: a question that has
# appeared on a public leaderboard is spent.
# To produce a held-out variant: copy this task.toml and change `id` (append a _heldout
# suffix), `source_repo` and `split`. The authoring script picks families by
# `source_repo`, and the result file names carry `split` too.
source_repo = "the data pipeline"
split = "open"
root = "data/t5_drawings2assembly"
default_dataset = "v1"
# Cases are produced by the data-gathering line (the data pipeline) and brought
# into the case format with tools/migrate_case.py.
generator = "tools/migrate_case.py or the data-gathering line"
