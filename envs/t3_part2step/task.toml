# t3_part2step -- rendered four-view images -> the 3-D geometry of that part
[task]
id = "t3_part2step"
kind = "part"
submission = "cadquery_program"
# given -- how much **3-D geometry** the model has in hand. It decides what the score
# means, and `inputs` alone cannot distinguish T2 from T5:
#   nothing_3d            everything is modelled from the drawings
#   purchased_parts_step  purchased parts come as 3-D, in-house parts are modelled from
#                         the drawings
#   all_parts_step        all part geometry is handed over; only placement is tested
given = "nothing_3d"
inputs = ["views.png"]

[tools]
# The reference renderer is NOT injected. bench_views.py is the module that
# produced the prompt images (same cameras, same pinned PARALLEL_SCALE), so
# supplying it made the model's render pixel-comparable to the target for free
# and turned much of the task into optimising against the function that
# generated the answer. Upstream measurement: 72% of programs compute a metric
# and 57% write a sweep loop against it.
#
# Task-design rule: do not supply what can be derived; do supply what cannot
# exist. A projection is derivable -- cadquery and vtk are both in the
# container -- so recovering the camera is part of the task.
renderer = "none"
inject = []

[verify]
entry = "envs.verifiers.part:score"
# T3/T4 supply rendered four-view images, so the pose is pinned by the task statement and
# orientation is ability rather than luck -- no orientation correction is applied.
orientation = "pinned"
# Headline metric (docs/METRICS.md, #26): part_v1 = 0.40 iou_norm + 0.35 surf_f1
# + 0.25 pix_fg, every term at the given pose -- pinned means no rotation search
# and nothing to align, so pose_mode is "lab". The raw 64^3 IoU stays as `iou`.
metric = "part_v1"
pose_mode = "lab"
# Band exclusions (cases that cannot measure anything) are **per case**, not per family
# -- and that was measured, not reasoned.
# Of slotted_din_rail's 10 variants, 8 have a shortest axis under 2 voxels (5 have only
# 0.80, with a floor of exactly 1.0000: at 64^3 GT simply **is** its own bounding box),
# but /02 (4.80 voxels, floor 0.3410) and /03 (9.60 voxels, floor 0.2609) are perfectly
# measurable tasks.
# Whether a case is thin is decided by its sampled parameters, not by its family, so
# excluding the whole family would throw away two good tasks.
# Raising the resolution does not rescue it: 0.80 voxels only reaches 6.4 at 512^3, and
# 512^3 means 134 million voxels per comparison.
band_exclude_cases = [
  "slotted_din_rail/00", "slotted_din_rail/01", "slotted_din_rail/04",
  "slotted_din_rail/05", "slotted_din_rail/06", "slotted_din_rail/07",
  "slotted_din_rail/08", "slotted_din_rail/09",
]
band_exclude_reason = "shortest axis <2 voxels; at 64^3 GT is indistinguishable from its own bounding box (5 cases have a floor of exactly 1.0000)"
oracle = "data/t3_part2step/_oracle"

[data]
# ⚠️ **The source corpus must be written down in the task declaration; it must never be
# inferred from a directory name or a runtime argument.**
# The T3/T4 families come from the open corpus `benchcad-2`; the held-out set comes from
# `the heldout corpus` and is **a different set of families**.
# Family names overlap between the two (one part family has a copy in each corpus), so
# the case name alone cannot tell them apart -- and once a held-out case is mixed into a
# batch of results, the held-out set is contaminated, irreversibly: a question that has
# appeared on a public leaderboard is spent.
# To produce a held-out variant: copy this task.toml and change `id` (append a _heldout
# suffix), `source_repo` and `split`. The authoring script picks families by
# `source_repo`, and the result file names carry `split` too.
source_repo = "benchcad-2"
split = "open"
root = "data/t3_part2step"
default_dataset = "v1"
# The generator lives in the data tree, not in this repo; there is no
# generator for T3/T4 here.
generator = "~/Projects/the data tree/tools/make_open_source.py"
generator_args = "--benchcad2 <repo> --out <dir> --families all --n 10 --workers 4"
