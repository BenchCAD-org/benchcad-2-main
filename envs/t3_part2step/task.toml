# t3_part2step -- rendered four-view images -> the 3-D geometry of that part
[task]
id = "t3_part2step"
kind = "part"
submission = "cadquery_program"
# given -- how much **3-D geometry** the model has in hand. It decides what the score
# means, and `inputs` alone cannot distinguish T2 from T5:
#   nothing_3d            everything is modelled from the drawings
#   purchased_parts_step  purchased parts come as 3-D, in-house parts are modelled from
#                         the drawings
#   all_parts_step        all part geometry is handed over; only placement is tested
given = "nothing_3d"
inputs = ["views.png"]

[tools]
# The reference renderer is NOT injected. bench_views.py is the module that
# produced the prompt images (same cameras, same pinned PARALLEL_SCALE), so
# supplying it made the model's render pixel-comparable to the target for free
# and turned much of the task into optimising against the function that
# generated the answer. Upstream measurement: 72% of programs compute a metric
# and 57% write a sweep loop against it.
#
# Task-design rule: do not supply what can be derived; do supply what cannot
# exist. A projection is derivable -- cadquery and vtk are both in the
# container -- so recovering the camera is part of the task.
renderer = "none"
inject = []

[verify]
entry = "envs.verifiers.part:score"
# T3/T4 supply rendered four-view images, so the pose is pinned by the task statement and
# orientation is ability rather than luck -- no orientation correction is applied.
orientation = "pinned"
# Headline metric (docs/METRICS.md, change 26): part_v1 = 0.5 iou_norm + 0.3 surf_f1
# + 0.2 pix_fg, every term at the given pose -- pinned means no rotation search
# and nothing to align, so pose_mode is "expert-fit". The raw 64^3 IoU stays as `iou`.
metric = "part_v1"
pose_mode = "expert-fit"

# The dev samples: the reference of each scores 1.0 and expected.json records it.
oracle = "examples/task3"

[data]
# What the cases are made from and which split this declaration is: the
# scorer reads neither, the bank tooling and the result files record both.
source_repo = "parametric"     # drawings | parametric | ecad
split = "open"               # open | heldout
