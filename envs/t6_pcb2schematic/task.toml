# t6_pcb2schematic -- renders of an assembled PCB (six views, plus one copper drawing per inner layer) -> terminal-net graph
[task]
id = "t6_pcb2schematic"
kind = "ecad"
submission = "graph_json"
inputs = ["views/view_*.png", "README.md"]
given = "renders_only"

[tools]
renderer = "none"
inject = []

[verifier]
# The phi search's two walls (the ECAD repo's declaration, tasks/*/task.toml):
# a search that hits either returns a lower bound with exact_search = false
# and search_limit naming the wall. Boards of 40+ parts with few legible
# designators are where it matters; the two ingested samples never get near.
timeout_sec = 3600.0
node_budget = 200000

[verify]
entry = "envs.verifiers.ecad:score"
# The headline is the graph metric itself, not one of the geometry metrics; naming
# it here keeps the record and the shipped expected.json from reading "legacy".
metric = "ecad_v2"
# Metric V2 on the named terminal-net graph: S_C * S_T * S_N * P_short * P_open.
# 0 for an unparseable graph or a fatal power-rail short. V1 reported as diagnostic.
orientation = "n/a"
# The oracle for this scorer is the fixture set itself: tests/test_t6_ecad.py pins
# a perfect, a partial and a dumb tier on tests/fixtures/t6 (0.47619 / 0.0 on the
# mutated graphs). A scorer change that moves those numbers is a different ruler.

# The dev samples: the reference of each scores 1.0 and expected.json records it.
oracle = "examples/task6"

[data]
# What the cases are made from and which split this declaration is: the
# scorer reads neither, the bank tooling and the result files record both.
source_repo = "ecad"     # drawings | parametric | ecad
split = "open"               # open | heldout
