# Evaluation configuration for the t2_realparts2assembly dev sample.
#
# GENERATED by tools/make_dev_samples.py. Every value is read out of the file
# that owns it, never restated from memory:
#
#   envs/t2_realparts2assembly/task.toml
#       the task contract: kind, what 3-D the model is given, the submission
#       form, the verifier entry point, the headline metric, orientation
#   envs/common/sandbox.py
#       the container and its limits, what is staged, what tools exist, the
#       300 dpi rasterisation of every input PDF
#   envs/common/episode.py
#       the round loop, the fence protocol, the image caps
#   harness/run.py
#       the runner defaults: rounds, per-round token cap, timeouts, retries
#
# Do not hand-edit. tests/test_dev_samples.py compares the headline metric back
# against task.toml and the round / token numbers back against harness/run.py.
#
# The scoring rule itself is docs/METRICS.md; this file says which rule applies
# and under what conditions the answer was produced.

[task]
id = "t2_realparts2assembly"
kind = "assembly"    # part | assembly | ecad -- selects the verifier
given = "all_parts_step"    # how much 3-D the model is handed; decides what the score means
submission = "cadquery_program"
submission_layout = "a directory: submission/parts/<part_id>.step, one file per part TYPE with the ids of input/bom.json, plus submission/assembly/instances.json ([{part_id, instance_id, transform}], transform a row-major 4x4 in mm from the part file's frame to the assembly frame). The scored assembly is REBUILT from parts x instances, so per-part scoring is by file name and the geometry in the assembly is the geometry in the part files; where the case supplies a part, the submitted file must be it (pose-free invariants within 1e-06 relative) or that type scores 0. submission/assembly/assembly.step is optional and never scored. A single STEP whose children are named <part_id>_i<k> is the old layout: still accepted and scored the same way, marked deprecated in the record"    # what the answer looks like on disk when the program has run
inputs = ["drawing.png", "drawing_tile_*.png", "bom.json", "step_files/*.step"]

[episode]
# One fenced block per reply, text and images only -- never a provider's own
# tool protocol, so scores stay comparable across vendors.
rounds = 100    # harness/run.py DEFAULT_ROUNDS; --rounds overrides
max_tokens_per_round = 16000    # harness/run.py DEFAULT_MAX_TOKENS, per model call
code_fence = "```python"    # runs in the working directory; stdout, stderr and new images come back
submit_fence = "```submit"    # the final answer; ends the episode
submission_variable = "none"    # the answer is the submission/ directory the program writes (tools.export_part + tools.submit_assembly); a `result` left over is exported to final.step, but the directory is what gets scored
working_dir_persists_between_rounds = true
seed_images_per_call = "all input images"    # no cap; round-one images are resent every round
observation_images_per_round = 3    # envs/common/episode.py _observation
observation_images_kept_for_rounds = 4    # harness/run.py KEEP_OBS_ROUNDS: older rounds' images leave the request, their text stays
many_image_downscale_px = 2000    # harness/run.py: a request over 20 images has every image downscaled to this on its longest side (the API's many-image rule)
forced_final_submission = true    # the last observation demands an answer; `submit_final` is recorded, so a deadline answer is never confused with a self-submission
failed_submission_retries = 1    # a program that crashes gets its own error back once; not a round
call_retries = 4    # harness/run.py ATTEMPTS
call_retry_backoff_seconds = 5    # harness/run.py BACKOFF_S, doubling
max_consecutive_failed_calls = 3    # envs/common/episode.py MAX_DEAD_ROUNDS, then the case is abandoned

[episode.timeouts]
exec_seconds = 600    # one code block in the sandbox (envs/common/episode.py run_episode)
model_call_seconds = 1800    # harness/run.py CALL_TIMEOUT_S
stream_idle_seconds = 90    # harness/run.py READ_IDLE_S: no bytes for this long is a wedged stream

[sandbox]
# The container submitted code runs in. Definition: sandbox/Dockerfile.
image = "benchcad-sandbox:arm64"    # override with CADENV_DOCKER_IMAGE
build = "docker build -t benchcad-sandbox:arm64 sandbox/"
python = "3.12"    # sandbox/Dockerfile: python:3.12-slim-trixie
memory = "2g"    # envs/common/sandbox.py MEMORY
cpus = "1"    # envs/common/sandbox.py CPUS
pids_limit = 256
network = "none"    # there is no network inside the container, at all
root_filesystem = "read-only"
writable_paths = ["/work", "/tmp (tmpfs, 256m)"]    # /work is this case's working directory, the only persistent one
environment = "empty (--env-file /dev/null) plus PYTHONPATH=/work"
libraries = ["cadquery 2.3.0", "cadquery-ocp 7.9.3.0", "numpy 1.26.4", "pillow 12.3.0", "scipy 1.17.1", "vtk 9.5.2", "trimesh 4.12.2", "matplotlib 3.11.1", "ezdxf 1.4.3"]    # pinned in sandbox/requirements.txt; nlopt 2.11.0 is installed --no-deps in the Dockerfile
reference_renderer_injected = false    # a projection is derivable inside the container (cadquery + vtk), so the renderer that made the prompt images is NOT handed over
injected_assets = []

[sandbox.staging]
staged = "input/, verbatim"    # the whole of what the model sees
rasterised = "every input PDF, to PNG beside itself at 300 dpi, long edge capped at 4200 px"    # envs/common/sandbox.py _rasterize_pdf; rasters are derived, never stored in a case
never_staged = ["gt/", "case.json", "expected.json"]    # the answer and the expected numbers stay outside the container

[sandbox.tools]
# Injected as tools.py in the working directory. Nothing else is added;
# the file listing in the prompt is generated from what is actually there.
export = "tools.export(result, path) -> STEP"
crop = "tools.crop(png, (left, top, right, bottom)) -> PNG"
export_part = "tools.export_part(geometry_or_step_path, part_id) -> submission/parts/<part_id>.step, one part TYPE"
use_part = "tools.use_part(part_id) -> copies the supplied step_files/<part_id>.step into submission/parts/, unchanged"
submit_assembly = "tools.submit_assembly(instances[, assembly]) -> submission/assembly/instances.json"

[verify]
entry = "envs.verifiers.assembly:score"    # the verifier; dispatched on this declaration, never sniffed
metric = "asm_v1"    # envs/t2_realparts2assembly/task.toml [verify] metric
headline_formula = "per-part-TYPE leave-one-type-out IoU gain, normalised by (1 - baseline)"
headline_range = [0.0, 1.0]
metric_reference = "docs/METRICS.md"
score_key = "score"
orientation = "free"    # free: the 24 proper rotations are searched (a drawing fixes no world frame). pinned: the given pose (the views fix it)
pose_mode = "iou24_aligned"    # how part_v1 poses the candidate for surf_f1 / pix_fg
avg_part_types = "all"    # avg_part averages over every part type of the case
diagnostics = ["iou", "hit", "avg_part", "asm_v1"]    # reported beside the headline in every record; never the score
command = "uv run python tools/verify_case.py examples/<taskN>/cases/<id> <your submission/ directory, or a single .step for the old layout>"
expected_scores = "cases/<id>/expected.json"
